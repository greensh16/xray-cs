[package]
name = "xray"
version = "1.1.0"
edition = "2024"
description = "HPC scientific Python linter for xarray, dask, and NumPy workflows"
authors = ["greensh16 <greensh16@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/greensh16/xray"
homepage = "https://github.com/greensh16/xray"
documentation = "https://github.com/greensh16/xray/wiki"
readme = "README.md"
keywords = ["linter", "hpc", "xarray", "dask", "numpy"]
categories = ["development-tools", "science", "command-line-utilities"]
# `tests/fixtures/` and `benches/` are deliberately included: the manifest
# declares a bench target and ships the integration tests, so excluding their
# sources left the published crate unable to run `cargo test` or `cargo bench`.
exclude = [
    "docs/",
    "editors/",
    "old/",
    "xray.wiki/",
    "ToFix.md",
    "ROADMAP.md",
    "xray.toml",
]

[[bin]]
name = "xray"
path = "src/main.rs"

[lib]
name = "xray"
path = "src/lib.rs"

[[bench]]
name = "throughput"
harness = false

[profile.release]
# Published binaries carry no debug symbols: a stripped CLI is materially
# smaller to download on an HPC login node, and a release backtrace is not
# useful anyway — panics report their message either way.
strip = true

[profile.bench]
# `bench` inherits from `release`, so stripping would take symbol names out of
# perf/Instruments output and make `cargo bench` profiling useless. Opt back in.
strip = false

[dependencies]
tree-sitter        = "0.26.7"
tree-sitter-python = "0.25"
clap               = { version = "4.6", features = ["derive", "color", "env"] }
clap_complete      = "4.5"
ariadne            = "0.6"
serde              = { version = "1.0.228", features = ["derive"] }
serde_json         = "1.0.149"
toml               = "1.0"
rayon              = "1.11.0"
glob               = "0.3.3"
streaming-iterator  = "0.1"
anyhow             = "1.0.102"
thiserror          = "2.0.18"
notify             = "6.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
criterion         = { version = "0.5", features = ["html_reports"] }
